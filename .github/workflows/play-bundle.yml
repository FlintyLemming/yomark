name: Play Bundle

# 打一份上传 Google Play 用的 release AAB（R8 混淆裁剪、固定签名）。
# 默认打内购版：导出带水印、一次性买断去水印，没有打赏入口。免费版的打赏会把人引到
# Play 结算以外的付款页，Play 的付款政策不允许，所以免费版只发 GitHub Releases。
# 只在 Actions 页手动触发。
# 产物：
# - yomark-play-aab：上传到 Play 管理中心的 .aab
# - yomark-release-arm64-v8a：同一份 release 构建的 APK，上传前先在自己手机上装一下，确认混淆后没跑坏
# - yomark-release-mapping：R8 的 mapping.txt，在 Play 上传为反混淆文件，崩溃堆栈才看得懂
on:
  workflow_dispatch:
    inputs:
      free_edition:
        description: '全功能免费版（带打赏入口，不能传 Play；不勾就是内购版）'
        type: boolean
        default: false

concurrency:
  group: play-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      FREE_EDITION: ${{ inputs.free_edition }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      # Play 上的应用签名密钥就是这把 keystore（首次上传时选「使用自己的密钥」导入），
      # 与 GitHub Releases 的 APK 同一签名，两个渠道才能互相覆盖安装。没有它宁可不打。
      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::未配置 SIGNING_KEYSTORE_BASE64，Play 的包必须用固定签名"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yomark-release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/yomark-release.jks" >> "$GITHUB_ENV"

      - name: Build release bundle and APKs
        run: |
          echo "FREE_EDITION=$FREE_EDITION"
          # 分两次跑：打 AAB 时 ABI 拆包会被关掉（见 build.gradle.kts 的 splits），APK 要单独打
          ./gradlew --no-daemon -Pyomark.freeEdition="$FREE_EDITION" :app:bundleRelease :app:assertReleaseNoRuntimePermissions
          ./gradlew --no-daemon -Pyomark.freeEdition="$FREE_EDITION" :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: yomark-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: yomark-release-arm64-v8a
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: yomark-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
