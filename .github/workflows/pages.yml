name: Pages

# 把 site/ 部署成 GitHub Pages 上的落地页，隐私权政策在 site/privacy/（应用设置页里链接的就是它）。
# 第一次用之前，在仓库 Settings → Pages 里把 Source 设成「GitHub Actions」，Custom domain 填 yomark.flinty.moe。
# main 上 site/ 或头图有改动时部署；Android APK 工作流发完 Release 会手动触发这里一次；也可以在 Actions 页手动触发。
# 部署时往页面里补两样东西：
#   - og.png：分享卡片的图，复制自 docs/readme/hero.png
#   - release.json：最新 Release 的版本号和 arm64-v8a APK 的直链，下载按钮读它。取不到时不生成，按钮停在 Releases 页面
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/readme/hero.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 一次只部署一个；已经在部署的不取消，免得发到一半
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          cp -r site _site
          cp docs/readme/hero.png _site/og.png
          # 分享卡片和 canonical 要绝对地址，页面里写的是自定义域名；Pages 实际地址不同（比如 fork 的 github.io）就换成实际地址
          find _site -name '*.html' -exec sed -i "s#https://yomark.flinty.moe/#${BASE_URL%/}/#g" {} +
          if gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '{
              tag: .tag_name,
              published: .published_at,
              apk: (first(.assets[] | select(.name | endswith("-arm64-v8a.apk")) | {url: .browser_download_url, size}) // null)
            }' > _site/release.json; then
            cat _site/release.json
          else
            echo "::warning::没取到最新 Release，下载按钮会指向 Releases 页面"
            rm -f _site/release.json
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
