name: Android APK

# 每次推送都打一份可直接安装的 debug APK；也可以在 Actions 页手动触发。
# 发版：推 v* 标签，或在 Actions 页手动触发并填 release_tag。两种方式都会在单元测试通过后
# 发一个 GitHub Release，附上这次打出的 APK；手动触发时标签由 Release 在当前提交上创建。
# 说明取自 docs/release-notes/<标签>.md，没有这个文件就让 GitHub 自动生成。
on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布的版本标签（如 v0.3.2），留空只打包不发版'
        required: false
        default: ''

concurrency:
  # 带上触发方式：手动发版不该被同分支随后的一次推送取消
  group: apk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # 发 Release 用
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Build debug APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assertDebugNoRuntimePermissions

      # 真机装 arm64-v8a，模拟器装 x86_64。按 ABI 拆包是因为 ONNX Runtime 的 .so 每个 ABI 二三十 MB。
      - uses: actions/upload-artifact@v4
        with:
          name: youma-debug-arm64-v8a
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: youma-debug-x86_64
          path: app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error

      # 放在上传之后：测试挂了也先把 APK 交出去，失败照样把这次运行标红
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      # 放在单元测试之后：测试不过不发版
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          mkdir dist
          for abi in arm64-v8a x86_64; do
            cp "app/build/outputs/apk/debug/app-$abi-debug.apk" "dist/youma-$TAG-$abi.apk"
          done
          notes="docs/release-notes/$TAG.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$TAG" dist/*.apk --title "$TAG" --target "$GITHUB_SHA" "$@"
