name: Android APK

# 每次推送都打一份可直接安装的 debug APK；也可以在 Actions 页手动触发。
# 推 v* 标签时额外发一个 GitHub Release，附上这次打出的 APK，说明取自标签注释。
on:
  push:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # 发 Release 用
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Build debug APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assertDebugNoRuntimePermissions

      # 真机装 arm64-v8a，模拟器装 x86_64。按 ABI 拆包是因为 ONNX Runtime 的 .so 每个 ABI 二三十 MB。
      - uses: actions/upload-artifact@v4
        with:
          name: youma-debug-arm64-v8a
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: youma-debug-x86_64
          path: app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error

      # 放在上传之后：测试挂了也先把 APK 交出去，失败照样把这次运行标红
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      # 放在单元测试之后：测试不过不发版
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # checkout 拿到的标签可能被拍平成轻量标签，重新取一次才读得到注释
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > notes.md
          mkdir dist
          for abi in arm64-v8a x86_64; do
            cp "app/build/outputs/apk/debug/app-$abi-debug.apk" "dist/youma-$TAG-$abi.apk"
          done
          gh release create "$TAG" dist/*.apk --title "$TAG" --notes-file notes.md --verify-tag
