name: Android APK

# 只在 Actions 页手动触发：打一份可直接安装的 debug APK。
# 发版：手动触发时填 release_tag，单元测试通过后发一个 GitHub Release，附上这次打出的 APK，标签由 Release 在当前提交上创建。
# 说明取自 docs/release-notes/<标签>.md，没有这个文件就让 GitHub 自动生成。发完版顺带重新部署落地页（pages.yml）。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布的版本标签（如 v0.3.2），留空只打包不发版'
        required: false
        default: ''

concurrency:
  # 都是手动点的，后一次排队等前一次，不取消，免得把正在发的版打断
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # 发 Release 用
      actions: write    # 发版后触发落地页重新部署
    env:
      # keystore 文件路径由下面的 Decode 步骤写进 SIGNING_KEYSTORE_FILE
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      # 用 Secrets 里的固定 keystore 签名，各版 APK 才能互相覆盖安装。
      # 没配 Secrets 时跳过，Gradle 退回 debug 签名（发版那步会拦下）。
      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 SIGNING_KEYSTORE_BASE64，这次用临时 debug 签名，APK 无法覆盖安装其他版本"
            exit 0
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yomark-release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/yomark-release.jks" >> "$GITHUB_ENV"

      - name: Build debug APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assertDebugNoRuntimePermissions

      # 真机装 arm64-v8a，模拟器装 x86_64。按 ABI 拆包是因为 ONNX Runtime 的 .so 每个 ABI 二三十 MB。
      - uses: actions/upload-artifact@v4
        with:
          name: yomark-debug-arm64-v8a
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: yomark-debug-x86_64
          path: app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error

      # 放在上传之后：测试挂了也先把 APK 交出去，失败照样把这次运行标红
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      # 放在单元测试之后：测试不过不发版
      - name: Publish release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # 临时签名的包装不上已有版本，不能拿去发版
          if [ -z "${SIGNING_KEYSTORE_FILE:-}" ]; then
            echo "::error::没有固定签名（缺 SIGNING_* Secrets），拒绝发版"
            exit 1
          fi
          mkdir dist
          for abi in arm64-v8a x86_64; do
            cp "app/build/outputs/apk/debug/app-$abi-debug.apk" "dist/yomark-$TAG-$abi.apk"
          done
          notes="docs/release-notes/$TAG.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$TAG" dist/*.apk --title "$TAG" --target "$GITHUB_SHA" "$@"
          # 落地页的下载按钮指向最新 Release 的 APK，让它重新部署一次。
          # 用 GITHUB_TOKEN 建的 Release 不会触发别的工作流，只能这样点名；没触发成也不影响这次发版
          gh workflow run pages.yml --ref "$DEFAULT_BRANCH" \
            || echo "::warning::没能触发落地页重新部署，可以在 Actions 页手动运行 Pages"
