<!doctype html>
<!-- README 的六种打码样式对照。node docs/readme/src/render.cjs styles 渲染成 docs/readme/styles.png
     六块小图裁自 ReadmeScreenshots 拍的编辑器截图（docs/readme/shots/），是应用的真实渲染结果。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #101014;
    --text: #1f2329;
    --mute: #6b7280;
    --line: #e6e8ec;
    --warn: #b45309;
    /* 截图缩放：原图 1236px 宽，小图裁的是其中 1040×230 的一块 */
    --k: 0.527;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #f7f8fa 0%, #f1f4f8 55%, #e9f1f8 100%);
    font-family: 'Noto Sans SC', sans-serif;
    color: var(--text);
    padding: 54px 64px 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, calc(1040px * var(--k)));
    grid-template-rows: repeat(3, auto);
    grid-auto-flow: column;
    column-gap: 56px; row-gap: 30px;
  }
  .cap { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; height: 26px; }
  .cap b { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
  .cap span { font-size: 14px; color: var(--mute); }
  .cap span.warn { color: var(--warn); }
  .tile {
    position: relative; overflow: hidden;
    width: calc(1040px * var(--k)); height: calc(230px * var(--k));
    border-radius: 14px; background: #fff;
    border: 1px solid rgba(16, 16, 20, 0.08);
    box-shadow: 0 2px 6px rgba(16, 16, 20, 0.05), 0 14px 34px rgba(16, 16, 20, 0.08);
  }
  .tile img {
    position: absolute; left: calc(-60px * var(--k));
    width: calc(1236px * var(--k));
  }
  /* 截图里图片的位置：带提醒文字的样式底栏高一行，图上移 39px */
  .tile img.y0 { top: calc(-1232px * var(--k)); }
  .tile img.y39 { top: calc(-1193px * var(--k)); }
</style>
</head>
<body>
  <div class="grid">
    <section>
      <div class="cap"><b>色块</b><span>默认样式 · 不可还原</span></div>
      <div class="tile"><img class="y0" src="../shots/editor.png" alt=""></div>
    </section>
    <section>
      <div class="cap"><b>表情</b><span>不可还原</span></div>
      <div class="tile"><img class="y0" src="../shots/editor-emoji.png" alt=""></div>
    </section>
    <section>
      <div class="cap"><b>抹除</b><span>不可还原</span></div>
      <div class="tile"><img class="y0" src="../shots/editor-erase.png" alt=""></div>
    </section>
    <section>
      <div class="cap"><b>马赛克</b><span class="warn">可能被还原</span></div>
      <div class="tile"><img class="y39" src="../shots/editor-pixelate.png" alt=""></div>
    </section>
    <section>
      <div class="cap"><b>模糊</b><span class="warn">可能被还原</span></div>
      <div class="tile"><img class="y39" src="../shots/editor-blur.png" alt=""></div>
    </section>
    <section>
      <div class="cap"><b>马克笔</b><span class="warn">只做标记，不遮盖</span></div>
      <div class="tile"><img class="y39" src="../shots/editor-marker.png" alt=""></div>
    </section>
  </div>
</body>
</html>
