<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>有码 Yomark</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF2F7"/>
    </linearGradient>
    <clipPath id="screen"><rect x="400" y="184" width="432" height="656" rx="64" /></clipPath>
    <linearGradient id="plate" x1="192" y1="332" x2="552" y2="692" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3E4256"/>
      <stop offset="1" stop-color="#111217"/>
    </linearGradient>
    <linearGradient id="plateLight" x1="0" y1="332" x2="0" y2="692" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="460" x2="0" y2="564" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9EBFB"/>
      <stop offset="1" stop-color="#79C6EA"/>
    </linearGradient>
    <filter id="plateShadow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="28"/>
      <feOffset dy="18" result="farOffset"/>
      <feFlood flood-color="#0E1430" flood-opacity="0.38"/>
      <feComposite in2="farOffset" operator="in" result="far"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="4" result="nearOffset"/>
      <feFlood flood-color="#0E1430" flood-opacity="0.3"/>
      <feComposite in2="nearOffset" operator="in" result="near"/>
      <feMerge><feMergeNode in="far"/><feMergeNode in="near"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- 截图：由浅到深的几行 -->
  <g clip-path="url(#screen)">
    <rect x="400" y="184" width="432" height="165" fill="#8DD5F3"/>
    <rect x="400" y="348" width="432" height="165" fill="#62B2EC"/>
    <rect x="400" y="512" width="432" height="165" fill="#4F8BDF"/>
    <rect x="400" y="676" width="432" height="165" fill="#4C62CC"/>
  </g>
  <!-- 方牌和码 -->
  <rect x="192" y="332" width="360" height="360" rx="60" fill="url(#plate)" filter="url(#plateShadow)"/>
  <rect x="192" y="332" width="360" height="360" rx="60" fill="url(#plateLight)"/>
  <rect x="256" y="460" width="232" height="104" rx="16" fill="url(#mark)"/>
</svg>
