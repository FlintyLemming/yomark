<!doctype html>
<!-- 官网的 apple-touch-icon，180×180。node docs/icon/src/render.cjs 渲染成 site/apple-touch-icon.png
     满版方形，圆角由 iOS 自己裁。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 180px; height: 180px; overflow: hidden; }
  img { display: block; }
</style>
</head>
<body><img src="../icon.svg" width="180" height="180" alt=""></body>
</html>
