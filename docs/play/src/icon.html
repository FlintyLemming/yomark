<!doctype html>
<!-- Play 商店图标，512×512。node docs/play/src/render.cjs icon 渲染成 docs/play/icon.png
     Play 要的是启动器图标的高清版：满版方形、不加圆角和阴影（圆角由 Play 统一裁）。
     图标母版 docs/icon/icon.svg 就是满版方形，1024 对应自适应图标露出来的 72 dp，原样缩到 512 即可。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  img { display: block; }
</style>
</head>
<body><img src="../../icon/icon.svg" width="512" height="512" alt=""></body>
</html>
