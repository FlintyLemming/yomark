<!doctype html>
<!-- 商店截图用的第二张样图：照着常见聊天界面排的版，不仿任何一款具体的应用。人名、地址、号码全是编的，
     电话用的是国内文档里常拿来举例的 138 0013 8000，邮箱和网址用的是保留域名 example.com。
     node docs/play/src/render.cjs chat-page 渲染成 app/src/test/resources/play/chat-page.png（1 倍，与 order-page.png 同尺寸） -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1680px; overflow: hidden; }
  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: #f2f3f5;
    color: #1f2329;
    font-size: 40px;
    display: flex; flex-direction: column;
  }
  .status { height: 96px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; font-size: 38px; font-weight: 500; background: #fff; }
  .status .bat { width: 64px; height: 30px; border: 3px solid #1f2329; border-radius: 8px; position: relative; }
  .status .bat::after { content: ''; position: absolute; inset: 4px 14px 4px 4px; background: #1f2329; border-radius: 3px; }
  .bar { height: 132px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; background: #fff; border-bottom: 2px solid #ebedf0; }
  .bar .back { width: 30px; height: 30px; border-left: 6px solid #1f2329; border-bottom: 6px solid #1f2329; transform: rotate(45deg); margin-left: 12px; }
  .bar .title { font-size: 46px; font-weight: 700; }
  .bar .more { display: flex; gap: 10px; }
  .bar .more i { width: 12px; height: 12px; border-radius: 50%; background: #1f2329; }

  .chat { flex: 1; padding: 16px 32px 0; display: flex; flex-direction: column; gap: 24px; }
  .time { align-self: center; font-size: 32px; color: #8a8f99; margin: 6px 0 0; }
  .msg { display: flex; align-items: flex-start; gap: 22px; }
  .msg.me { flex-direction: row-reverse; }
  .avatar { width: 96px; height: 96px; border-radius: 50%; flex: none; background: linear-gradient(135deg, #ffd9a8, #f6a35c); }
  .me .avatar { background: linear-gradient(135deg, #b9dcff, #6aa6f8); }
  .bubble {
    max-width: 760px; padding: 20px 32px; border-radius: 30px;
    background: #fff; line-height: 1.45; letter-spacing: 0.5px;
  }
  .them .bubble { border-top-left-radius: 8px; }
  .me .bubble { background: #2f7cf6; color: #fff; border-top-right-radius: 8px; }
  /* 同一个人连发时，后面几条不再重复头像 */
  .msg.cont .avatar { visibility: hidden; height: 0; }

  .input { height: 140px; flex: none; display: flex; align-items: center; gap: 24px; padding: 0 32px; background: #fff; border-top: 2px solid #ebedf0; }
  .input .plus { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #5c6370; position: relative; flex: none; }
  .input .plus::before, .input .plus::after { content: ''; position: absolute; background: #5c6370; border-radius: 2px; }
  .input .plus::before { left: 16px; right: 16px; top: 30px; height: 4px; }
  .input .plus::after { top: 16px; bottom: 16px; left: 30px; width: 4px; }
  .input .field { flex: 1; height: 84px; border-radius: 42px; background: #f2f3f5; }
  .input .send { font-size: 36px; color: #fff; background: #2f7cf6; border-radius: 40px; padding: 14px 34px; }
</style>
</head>
<body>
  <div class="status"><span>10:24</span><span class="bat"></span></div>
  <div class="bar"><span class="back"></span><span class="title">王小明</span><span class="more"><i></i><i></i><i></i></span></div>

  <div class="chat">
    <div class="time">昨天 21:46</div>
    <div class="msg them"><span class="avatar"></span><div class="bubble">周六来我家吃饭吧</div></div>
    <div class="msg them cont"><span class="avatar"></span><div class="bubble">地址：长江路88号阳光新村5幢302室</div></div>
    <div class="msg me"><span class="avatar"></span><div class="bubble">好嘞，几点到合适？</div></div>
    <div class="msg them"><span class="avatar"></span><div class="bubble">中午十二点，到了给我打电话</div></div>
    <div class="msg them cont"><span class="avatar"></span><div class="bubble">138 0013 8000</div></div>
    <div class="msg them cont"><span class="avatar"></span><div class="bubble">顺路帮我取个快递，取件码 5-1-0307</div></div>
    <div class="time">今天 09:12</div>
    <div class="msg them"><span class="avatar"></span><div class="bubble">上次聚会的照片在这：<br>pan.example.com/s/8fK2xQ</div></div>
    <div class="msg them cont"><span class="avatar"></span><div class="bubble">原图发你邮箱了：<br>wangxm@example.com</div></div>
  </div>

  <div class="input"><span class="plus"></span><span class="field"></span><span class="send">发送</span></div>
</body>
</html>
